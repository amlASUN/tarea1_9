<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>
    <!-- form: define un formulario HTML para recopilar datos del usuario -->
    <!-- action: indica la URL o archivo al que se enviarán los datos del formulario -->
    <!-- method: especifica el método HTTP para enviar los datos, como get o post -->
    <form action="index.html" method="get">
    <!-- fieldset: agrupa elementos relacionados dentro de un formulario, creando un recuadro -->
    <legend>Datos personales by Aitor</legend>

    <!-- label: etiqueta descriptiva asociada a un control de formulario -->
    <!-- for: vincula el label con un elemento mediante su id para mejorar la accesibilidad -->
    <!-- id: identificador único para un elemento HTML -->
    <!-- name: nombre del campo que se enviará al servidor con los datos introducidos -->
    <!-- input: elemento interactivo para que el usuario introduzca datos -->
    <!-- type: define el comportamiento y la apariencia del input -->
    <!-- text: tipo de input para texto plano de una sola línea -->
    <!-- placeholder: texto de ayuda o ejemplo que se muestra dentro del campo antes de escribir -->
    <!-- required: indica que rellenar este campo es obligatorio para enviar el formulario -->
    <!-- autofocus: hace que el campo gane el foco de forma automática al cargar la página -->
    <!-- size: define el ancho visible del campo de texto en caracteres -->
    <!-- maxlength: establece el número máximo de caracteres permitidos -->
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required autofocus size="30" maxlength="40">
    <br><br>

    <!-- password: tipo de input que oculta los caracteres introducidos con puntos o asteriscos para mayor seguridad -->
    <!-- minlength: establece el número mínimo de caracteres requeridos para que el campo sea válido -->
    <label for="contrasena">Contraseña:</label>
    <input type="password" id="contrasena" name="contrasena" minlength="8">
    <br><br>

    <!-- email: tipo de input optimizado para correos electrónicos que incluye validación automática de formato -->
    <label for="correo">Correo:</label>
    <input type="email" id="correo" name="correo" required>
    <br><br>

    <!-- tel: tipo de input diseñado para introducir números de teléfono -->
    <!-- pattern: define una expresión regular que el valor del campo debe cumplir para considerarse válido -->
    <label for="telefono">Teléfono:</label>
    <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}">
    <br><br>
    <!-- date: tipo de input que muestra un selector de fecha adaptado al calendario -->
    <label for="fecha-nacimiento">Fecha de nacimiento:</label>
    <input type="date" id="fecha-nacimiento" name="fecha_nacimiento">
    <br><br>

    <!-- file: tipo de input que permite al usuario seleccionar uno o varios archivos desde su dispositivo -->
    <label for="foto">Foto:</label>
    <input type="file" id="foto" name="foto">
    <br><br>

    <!-- value: define el valor predeterminado que tendrá el elemento de formulario -->
    <!-- readonly: hace que el campo sea de solo lectura; el usuario puede verlo y seleccionarlo, pero no modificarlo -->
    <label for="curso">Curso:</label>
    <input type="text" id="curso" name="curso" value="2026-27" readonly>
    <br><br>

    <!-- disabled: deshabilita el elemento por completo; no se puede interactuar con él ni se envía su valor en el formulario -->
    <label for="centro">Centro:</label>
    <input type="text" id="centro" name="centro" value="IES La Asunción" disabled>
    </fieldset>
    <!-- fieldset: segunda sección para agrupar las preferencias del usuario -->
    <fieldset>
    <!-- legend: título descriptivo para este segundo grupo de campos -->
    <legend>Preferencias</legend>

    <!-- radio: tipo de input que permite seleccionar una única opción entre varias excluyentes con el mismo name -->
    <label>Turno:</label><br>
    <input type="radio" id="turno-manana" name="turno" value="mañana">
    <label for="turno-manana">Mañana</label>
    <input type="radio" id="turno-tarde" name="turno" value="tarde">
    <label for="turno-tarde">Tarde</label>
    <br><br>

    <!-- checkbox: tipo de input que permite seleccionar múltiples opciones independientes de forma simultánea -->
    <label>Intereses:</label><br>
    <input type="checkbox" id="interes-deporte" name="intereses" value="deporte">
    <label for="interes-deporte">Deporte</label>
    <input type="checkbox" id="interes-musica" name="intereses" value="musica">
    <label for="interes-musica">Música</label>
    <input type="checkbox" id="interes-lectura" name="intereses" value="lectura">
    <label for="interes-lectura">Lectura</label>
    <br><br>

    <!-- number: tipo de input optimizado para introducir valores numéricos -->
    <!-- min: establece el valor numérico mínimo permitido -->
    <!-- max: establece el valor numérico máximo permitido -->
    <!-- step: define el incremento o intervalo válido entre los números -->
    <label for="horas">Horas de estudio:</label>
    <input type="number" id="horas" name="horas" min="0" max="10" step="2">
    <br><br>

    <!-- range: tipo de input que muestra un control deslizante (slider) para seleccionar un valor numérico en un rango -->
    <label for="nivel">Nivel:</label>
    <input type="range" id="nivel" name="nivel" min="1" max="10">
    <br><br>

    <!-- color: tipo de input que abre un selector gráfico de colores en formato hexadecimal -->
    <label for="color">Color favorito:</label>
    <input type="color" id="color" name="color">
    <br><br>

    <!-- time: tipo de input para introducir o seleccionar horas, minutos y segundos -->
    <label for="hora">Hora:</label>
    <input type="time" id="hora" name="hora">
    <br><br>

    <!-- week: tipo de input para seleccionar una semana específica del año -->
    <label for="semana">Semana:</label>
    <input type="week" id="semana" name="semana">
    <br><br>

    <!-- month: tipo de input para seleccionar un mes y año específicos -->
    <label for="mes">Mes:</label>
    <input type="month" id="mes" name="mes">
    <br><br>
    <!-- select: crea una lista desplegable de opciones -->
    <!-- multiple: permite al usuario seleccionar varias opciones de la lista a la vez -->
    <!-- optgroup: agrupa opciones relacionadas dentro de un elemento select -->
    <!-- option: define una opción seleccionable dentro de un select o datalist -->
    <!-- selected: marca una opción para que aparezca seleccionada por defecto al cargar la página -->
    <label for="modulos">Módulos:</label>
    <select id="modulos" name="modulos" multiple>
      <optgroup label="Primero">
        <option value="lm" selected>Lenguaje de Marcas</option>
        <option value="fol">FOL</option>
      </optgroup>
      <optgroup label="Segundo">
        <option value="diw">Diseño Web</option>
        <option value="daw">Despliegue</option>
      </optgroup>
    </select>
    <br><br>

    <!-- textarea: crea un área de texto multilínea para comentarios o mensajes largos -->
    <!-- rows: define el número visible de líneas de altura del textarea -->
    <!-- cols: define el ancho visible en columnas (caracteres) del textarea -->
    <label for="comentarios">Comentarios:</label>
    <textarea id="comentarios" name="comentarios" rows="4" cols="30"></textarea>
    </fieldset>

    </form>
</body>
</html>
